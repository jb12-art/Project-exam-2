<!-- This file let you open a new browser tab in GitHub pages -->

<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Holidaze</title>

    <script>
      const base = '/Project-exam-2';
      const path = window.location.pathname;

      if (path.startsWith(base)) {
        const route = path.slice(base.length) || '/';

        window.location.replace(
          `${base}/?redirect=${encodeURIComponent(route)}`,
        );
      }
    </script>
  </head>

  <body>
    <p>Redirecting...</p>
  </body>
</html>
