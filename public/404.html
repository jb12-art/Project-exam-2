<!-- This file let you open a new browser tab in GitHub pages -->

<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Holidaze</title>

    <script>
      const path = window.location.pathname;
      const base = '/Project-exam-2/';

      if (path.startsWith(base)) {
        const route = path.substring(base.length);

        window.location.replace(
          base + '/?redirect=' + encodeURIComponent(route),
        );
      }
    </script>
  </head>

  <body></body>
</html>
